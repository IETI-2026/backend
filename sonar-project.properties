sonar.projectKey=IETI-2026_backend
sonar.organization=ieti-2026
sonar.projectName=IETI Backend

# Sources
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,src/main.ts

# Language
sonar.language=ts
